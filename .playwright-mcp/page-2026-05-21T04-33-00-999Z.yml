    - heading "Question" [level=2] [ref=e11]
    - paragraph [ref=e12]: "While researching a topic, a student has taken the following notes:"
    - list [ref=e13]:
      - listitem [ref=e14]: Crown shyness is a phenomenon in which the tops (crowns) of neighboring trees grow close together but don’t overlap.
      - listitem [ref=e15]: To explain how this happens, Australian forester M.R. Jacobs proposes the mutual abrasion theory.
      - listitem [ref=e16]: According to Jacobs’s theory, when trees brush against one another, branches break off.
      - listitem [ref=e17]: Malaysian scholar Francis S.P. Ng posits the mutual shade avoidance theory.
      - listitem [ref=e18]: According to Ng’s theory, when tree branches detect shade from nearby trees’ branches, they stop growing.
    - paragraph [ref=e19]: The student wants to compare the causes of crown shyness proposed in the two theories. Which choice most effectively uses relevant information from the notes to accomplish this goal?