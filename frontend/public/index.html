<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ZooPrep - Master the Digital SAT with personalized practice and skill-level tracking" />
    <title>ZooPrep - SAT Prep</title>
    <!-- Set theme before first paint to avoid a flash of the wrong theme (FOUC) -->
    <script>
      (function () {
        var el = document.documentElement;
        // Opt into JS-enhanced reveals (content is visible by default without this)
        el.classList.add('js');
        try {
          var stored = localStorage.getItem('darkMode');
          if (stored === 'true') el.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Fonts: Inter (UI/body/data) + Fraunces (display headings & scores) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <!-- MathJax for rendering math in SAT questions and reference sheet -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']]
        },
        options: {
          enableMenu: false,
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" async></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
